name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-pack-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $projects = @('Idb.Libraries/Idb.Libraries.csproj',
            'InterfaceDB.Storage.SegmentCore/InterfaceDB.Storage.SegmentCore.csproj',
            'InterfaceDB.Authentication/InterfaceDB.Authentication.csproj',
            'InterfaceDB.Transport/InterfaceDB.Transport.csproj')
          foreach ($project in $projects) {
            [xml] $xml = Get-Content -LiteralPath $project
            $version = [string] $xml.Project.PropertyGroup.Version
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Release tag does not match $project version $version."
            }
          }

      - name: Verify public source boundary
        shell: pwsh
        run: ./Scripts/Test-PublicSourceBoundary.ps1

      - name: Restore
        run: dotnet restore InterfaceDB.sln

      - name: Build
        run: dotnet build InterfaceDB.sln -c Release --no-restore -warnaserror:CS9057

      - name: Test InterfaceDB
        run: dotnet test InterfaceDb.Tests/InterfaceDb.Tests.csproj -c Release --no-build --no-restore

      - name: Test analyzers
        run: dotnet test Idb.Analyzers.Tests/Idb.Analyzers.Tests.csproj -c Release --no-build --no-restore

      - name: Test SegmentCore provider
        run: dotnet test InterfaceDB.Storage.SegmentCore.Tests/InterfaceDB.Storage.SegmentCore.Tests.csproj -c Release --no-build --no-restore

      - name: Test TCP
        run: dotnet test InterfaceDB.Transport.Tests/InterfaceDB.Transport.Tests.csproj -c Release --no-build --no-restore

      - name: Test authentication
        run: dotnet test InterfaceDB.Authentication.Tests/InterfaceDB.Authentication.Tests.csproj -c Release --no-build --no-restore

      - name: Verify benchmark object-materialization contract
        run: dotnet run -c Release --no-build --no-restore --project StorageBenchmarks.Transactions -- --materialization-self-test

      - name: Run integration harness
        run: dotnet run -c Release --no-build --no-restore --project InterfaceDb.IntegrationTests

      - name: Verify complete-repository smoke matrix
        run: dotnet run -c Release --project StorageBenchmarks.Repository -- --smoke --records 200 --batch 32 --output artifacts/repository-smoke.json

      - name: Verify storage-review benchmark correctness
        run: dotnet run -c Release --no-build --project StorageBenchmarks.Repository -- --review-baseline --smoke --records 32 --engines SegmentCore --output artifacts/review-smoke.json

      - name: Pack public packages
        run: |
          dotnet pack Idb.Libraries/Idb.Libraries.csproj -c Release --no-build --no-restore --output artifacts/packages
          dotnet pack InterfaceDB.Storage.SegmentCore/InterfaceDB.Storage.SegmentCore.csproj -c Release --no-build --no-restore --output artifacts/packages
          dotnet pack InterfaceDB.Authentication/InterfaceDB.Authentication.csproj -c Release --no-build --no-restore --output artifacts/packages
          dotnet pack InterfaceDB.Transport/InterfaceDB.Transport.csproj -c Release --no-build --no-restore --output artifacts/packages

      - name: Verify public package boundary
        shell: pwsh
        run: ./Scripts/Test-PublicPackageBoundary.ps1 -Version ($env:GITHUB_REF_NAME.Substring(1))

      - name: Acquire temporary NuGet credential
        uses: NuGet/login@v1
        id: login
        with:
          user: ToolMaker

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
